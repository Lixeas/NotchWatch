name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: self-hosted
    steps:
      - name: Mask personal info in logs
        run: |
          echo "::add-mask::$HOME"
          echo "::add-mask::$(whoami)"

      - uses: actions/checkout@v4

      - name: Swift toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
