name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (no leading v), e.g. 1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: self-hosted
    steps:
      - name: Mask personal info in logs
        run: |
          echo "::add-mask::$HOME"
          echo "::add-mask::$(whoami)"

      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: swift build -c release

      - name: Assemble NotchWatch.app
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          BIN_PATH=$(swift build -c release --show-bin-path)
          APP="NotchWatch.app"

          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$BIN_PATH/NotchWatch" "$APP/Contents/MacOS/NotchWatch"

          # SPM resource bundle (embedded fonts) — copy if present next to the built binary.
          for bundle in "$BIN_PATH"/*.bundle; do
            [ -d "$bundle" ] && cp -R "$bundle" "$APP/Contents/Resources/"
          done

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>NotchWatch</string>
            <key>CFBundleIdentifier</key><string>com.lixeas.notchwatch</string>
            <key>CFBundleName</key><string>NotchWatch</string>
            <key>CFBundleDisplayName</key><string>NotchWatch</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # Rasterize the vector brand mark at every required size (NSImage renders the SVG as
          # vector, not a blown-up 16px bitmap) and pack it into a proper multi-resolution .icns.
          swift Scripts/generate-icon.swift \
            NotchWatch/Resources/Images/notchwatch-corbeau-16-modified.svg \
            AppIcon.iconset
          iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"

          # No Apple Developer ID available: ad-hoc sign only. Users get a Gatekeeper
          # warning on first launch (documented in README) — not notarized.
          codesign --force --deep --sign - "$APP"

      - name: Create .dmg
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          rm -rf dmg-root
          mkdir dmg-root
          cp -R NotchWatch.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "NotchWatch" -srcfolder dmg-root -ov -format UDZO "NotchWatch-$VERSION.dmg"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          NOTES_FILE=".github/release-notes/v$VERSION.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "v$VERSION" "NotchWatch-$VERSION.dmg" \
              --title "NotchWatch v$VERSION" \
              --notes-file "$NOTES_FILE" \
              --latest
          else
            gh release create "v$VERSION" "NotchWatch-$VERSION.dmg" \
              --title "NotchWatch v$VERSION" \
              --generate-notes \
              --latest
          fi

      - name: Bump Homebrew cask
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          SHA=$(shasum -a 256 "NotchWatch-$VERSION.dmg" | cut -d ' ' -f1)

          git fetch origin main
          git checkout -B main origin/main

          sed -i '' -E "s/version \".*\"/version \"$VERSION\"/" Casks/notch-watch.rb
          sed -i '' -E "s/sha256 \".*\"/sha256 \"$SHA\"/" Casks/notch-watch.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/notch-watch.rb
          git diff --staged --quiet || git commit -m "chore: bump cask to v$VERSION"
          git push origin main
